openapi: "3.0.3"
info:
  title: Waste Collection Schedule Service
  version: "0.4"
servers:
  - url: /api
paths:
  /schedule:
    get:
      summary: Gets a schedule for a particular UPRN
      operationId: getSchedule
      tags:
        - POC
      parameters:
        - name: uprn
          in: query
          required: true
          schema:
            type: string
        - name: localCustodianCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 70
                items:
                  $ref: "#/components/schemas/Schedule"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
        default:
          description: Unexpected error
  /address/{postcode}:
    get:
      summary: Gets a list of possible addresses for a particular postcode
      operationId: getAddress
      tags:
        - POC
      parameters:
        - name: postcode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{1,2}[0-9][0-9A-Z]?\s?[0-9][A-Z]{2}$'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 8000
                items:
                  $ref: "#/components/schemas/ListAddress"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
        default:
          description: Unexpected error

components:
  schemas:
    Schedule:
      type: object
      required:
        - date
        - binName
      properties:
        date:
          type: string
          description: The date the bin will be collected
          format: date
        binName:
          type: string
          description: Council provided bin name e.g. General Waste
        binColour:
          type: string
          description: Optional bin colour
          enum:
            - black
            - green
            - red
            - blue
            - brown
            - yellow
            - silver
            - purple
        binContents:
          type: string
          description: Optional list of bin contents e.g. Plastics
    ListAddress:
      type: object
      required:
        - addressFull
        - uprn
        - localCustodianCode
      properties:
        addressFull:
          type: string
          description: The full address that will be presented to the user to select address
        uprn:
          type: string
          description: Unique property reference number
        localCustodianCode:
          type: string
          description: A unique reference number for each council provided by OS Data Hub
    BadRequestResponse:
      type: object
      enum:
        - councilNotSupported
        - postcodeNotFound
        - invalidPostcode
        - unknownError
      properties:
        message:
          type: string
    PostcodeNotFound:
      type: object
      properties:
        message:
          type: string
